# SPA nginx — live & staging React (HAProxy terminates TLS on host)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;
    client_max_body_size 5m;

    # Security headers (repeat on locations that set their own add_header — nginx inheritance quirk)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CRA + Tawk/GA/sockets — keep connect-src open enough for APIs and WSS
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://embed.tawk.to https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://embed.tawk.to; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.betmundial.com https://apistaging.betmundial.com https://*.betmundial.com wss: https: https://*.tawk.to wss://*.tawk.to https://www.google-analytics.com https://*.google-analytics.com https://*.logrocket.io https://*.lr-ingest.io; frame-src 'self' https://tawk.to https://*.tawk.to https://www.googletagmanager.com; upgrade-insecure-requests" always;

    location ~ /\.(env|git|htaccess|svn|DS_Store|yaml|yml|ini|log|conf|bak|old|sql|sh) {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
        return 403;
    }

    location ~* \.(php|pl|py|sh|exe)$ {
        deny all;
        return 403;
    }

    location ~* ^/vendor/ {
        deny all;
        return 403;
    }

    location ~* ^/(storage|uploads|images|assets|files|tmp)/.*\.php$ {
        deny all;
        return 403;
    }

    location ~* ^/node_modules/ {
        deny all;
        return 403;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://embed.tawk.to https://cdn.jsdelivr.net https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://embed.tawk.to; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.betmundial.com https://apistaging.betmundial.com https://*.betmundial.com wss: https: https://*.tawk.to wss://*.tawk.to https://www.google-analytics.com https://*.google-analytics.com https://*.logrocket.io https://*.lr-ingest.io; frame-src 'self' https://tawk.to https://*.tawk.to https://www.googletagmanager.com; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        log_not_found off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
