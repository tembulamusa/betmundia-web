<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!-- Tawk noise filters only at boot; embed script is deferred via app idle loader -->
  <script type="text/javascript">
    (function () {
      function isTawkNoise(message, source) {
        var msg = String(message || '');
        var src = String(source || '');
        return /tawk/i.test(msg) || /tawk\.to/i.test(src) || /embed\.tawk/i.test(src) || /twk-/i.test(msg);
      }

      window.addEventListener('error', function (event) {
        if (isTawkNoise(event && event.message, event && event.filename)) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = reason && (reason.message || reason);
        var stack = reason && reason.stack;
        if (isTawkNoise(msg, stack)) {
          event.preventDefault();
        }
      });

      window.Tawk_API = window.Tawk_API || {};
      window.Tawk_LoadStart = new Date();
    })();
  </script>
  <!-- GTM / Pixel / gtag / Tawk embed: deferred in src (idle after first paint) -->

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="betmundial; Bet Sure, Bet Tamu, Bet Yetu" />

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon-32x32.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>Betmundial - Sports Betting</title>

</head>

<body onscroll="getScrollLength()">

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQXFR5QP" height="0" width="0"
      style="display:none;visibility:hidden"></iframe>
  </noscript>

  <noscript>You need to enable JavaScript to run this app.</noscript>

  <div id="app"></div>

  <!-- jQuery CDN + Pragmatic fullscreen removed from critical path.
       Loaded on casino routes via ensureCasinoExternalScripts (npm jquery). -->

  <!-- Scroll Detector -->
  <script>
    function getScrollLength() {
      if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 350) {
        document.dispatchEvent(new Event('scrollEnd'));
      }
    }
  </script>

  <script>
    let userInteracted = false;
    let isInternalNavigation = false;

    const markInteraction = () => {
      userInteracted = true;
    };

    window.addEventListener("click", markInteraction);
    window.addEventListener("mousemove", markInteraction);
    window.addEventListener("keydown", markInteraction);
    window.addEventListener("scroll", markInteraction);

    document.addEventListener("click", function (e) {
      const link = e.target.closest("a");

      if (!link) return;

      const url = new URL(link.href, window.location.origin);

      if (url.origin === window.location.origin) {
        isInternalNavigation = true;
      }
    });

    window.addEventListener("popstate", function () {
      isInternalNavigation = true;
    });

    window.addEventListener("beforeunload", function (e) {
      if (!userInteracted) return;

      if (isInternalNavigation) return;

      e.preventDefault();
      e.returnValue = "";
    });
  </script>

</body>

</html>
