  <!-- Scroll Detector -->
  <script>
    function getScrollLength() {
      if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 350) {
        document.dispatchEvent(new Event('scrollEnd'));
      }
    }
  </script>

  <script>
    let userInteracted = false;
    let isInternalNavigation = false;

    // ✅ Track user interaction (required)
    const markInteraction = () => {
      userInteracted = true;
    };

    window.addEventListener("click", markInteraction);
    window.addEventListener("mousemove", markInteraction);
    window.addEventListener("keydown", markInteraction);
    window.addEventListener("scroll", markInteraction);

    // ✅ Detect internal navigation (same domain links)
    document.addEventListener("click", function (e) {
      const link = e.target.closest("a");

      if (!link) return;

      const url = new URL(link.href, window.location.origin);

      // If same origin → internal navigation
      if (url.origin === window.location.origin) {
        isInternalNavigation = true;
      }
    });

    // ✅ Detect SPA navigation (React Router)
    window.addEventListener("popstate", function () {
      isInternalNavigation = true;
    });

    // ✅ Main unload handler
    window.addEventListener("beforeunload", function (e) {
      if (!userInteracted) return;

      // ❌ Skip alert for internal navigation
      if (isInternalNavigation) return;

      e.preventDefault();
      e.returnValue = "";
    });
  </script>
